<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akili Bahati | Data and software</title>
    <meta name="description" content="Akili Bahati is an Informatics graduate from the University at Albany who builds prediction models and the dashboards that show their work. Gridiron, Court Vision and more." />
    <meta name="theme-color" content="#F3EFE7" />
    <meta property="og:title" content="Akili Bahati" />
    <meta property="og:description" content="Prediction models and the dashboards that show their work." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              paper: 'var(--paper)',
              raised: 'var(--raised)',
              ink: 'var(--ink)',
              muted: 'var(--muted)',
              line: 'var(--line)',
              accent: 'var(--accent)',
            },
            fontFamily: {
              display: ['"Instrument Serif"', 'Georgia', 'serif'],
              sans: ['Geist', 'system-ui', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f3efe7;
        --raised: #ebe6db;
        --ink: #1c1a16;
        --muted: #6a6459;
        --line: #d9d2c3;
        --accent: #a3461f;
      }
      .dark {
        --paper: #141311;
        --raised: #1c1a17;
        --ink: #ece7dc;
        --muted: #a09a8c;
        --line: #2c2a25;
        --accent: #e08a62;
      }
      html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: Geist, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3 { text-wrap: balance; }
      p { text-wrap: pretty; }
      ::selection { background: var(--accent); color: var(--paper); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
      :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
      /* Display type: tighter as it grows, looser when small (Apple optical tracking) */
      .font-display { letter-spacing: -0.02em; }
      .font-mono { letter-spacing: 0.02em; }
      /* Entrance: ease-out, short, staggered via --i */
      .rise { animation: rise 0.5s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      /* Scroll reveal: transitions, so a fast scroll never restarts them */
      .reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out); }
      .reveal[data-in='true'] { opacity: 1; transform: none; }
      /* Pressable: instant feedback on press, snappy release */
      .press { transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out), color 160ms var(--ease-out); }
      .press:active { transform: scale(0.97); }
      @media (hover: hover) and (pointer: fine) {
        .lift:hover { transform: translateY(-2px); }
        .zoom:hover img { transform: scale(1.02); }
      }
      .zoom img { transition: transform 500ms var(--ease-out); }
      /* Translucent chrome: content scrolls under it */
      .chrome { background: color-mix(in srgb, var(--paper) 72%, transparent); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); }
      @media (prefers-reduced-transparency: reduce) { .chrome { background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; } }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .rise { animation: none; }
        .reveal { transform: none; transition: opacity 0.2s ease; }
        .press:active { transform: none; }
        .lift:hover, .zoom:hover img { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
